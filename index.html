<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Name Portfolio</title>
<meta name="description" content="Bots, games, scripts and websites. A long, loud, interactive portfolio.">
<meta name="theme-color" content="#2A3CFF">
<meta property="og:type" content="website">
<meta property="og:title" content="Your Name Portfolio">
<meta property="og:description" content="Bots, games, scripts and websites. A long, loud, interactive portfolio.">
<!-- TODO: add <meta property="og:image" content="https://your-domain/assets/images/og.jpg"> for link previews -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FFD23F'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23fff' fill-opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&family=Unbounded:wght@300..900&display=swap">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="fb" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="flash" id="flash"></div>
<div class="prog" id="prog" aria-hidden="true"></div>

<header class="top" id="top">
  <a class="logo" id="logo" href="#home" data-magnet data-cursor="link" aria-label="Back to top"></a>
  <div class="meta mono"><b id="cityLab"></b><span id="clock"></span></div>
  <div class="ctrls">
    <button class="pillbtn" id="cwBtn" type="button" data-magnet aria-label="Change colorway"><span class="dots"><i></i><i></i><i></i></span><span id="cwName">Cobalt</span></button>
    <button class="pillbtn" id="sndBtn" type="button" data-magnet aria-pressed="false" aria-label="Toggle sound"><span class="eq"><i></i><i></i><i></i><i></i></span><span id="sndTxt">Sound off</span></button>
  </div>
</header>

<nav class="dock" id="dock" aria-label="Sections">
  <div class="dock__in" id="dockIn">
    <span class="dock__pill" id="dockPill"></span>
    <a href="#home" data-s="0" class="on">Home</a>
    <a href="#work" data-s="1">Work</a>
    <a href="#about" data-s="2">About</a>
    <a href="#contact" data-s="3">Contact</a>
  </div>
</nav>
<aside class="rail" id="rail" aria-label="Project chapters"></aside>
<div class="hud mono" id="hud" aria-hidden="true"><i></i><i></i><i></i><i></i><span id="bpmLab"></span><span id="chapLab" class="chaplab"></span></div>
<div class="keys mono" aria-hidden="true"><kbd>C</kbd> colors &nbsp; <kbd>S</kbd> sound</div>

<main class="wrap">

  <section class="hero" id="home">
    <h1 class="name" id="name"></h1>
    <div class="hero__row">
      <p class="role intro-el" id="role" style="--d:1.15s"></p>
      <p class="lede intro-el" id="lede" style="--d:1.25s"></p>
      <div class="cta intro-el" style="--d:1.35s">
        <button class="btn btn--solid" id="playBtn" type="button" data-magnet data-cursor="link"><span id="playTxt">Play the beat</span></button>
        <a class="btn" href="#work" data-magnet data-cursor="link">See the work</a>
      </div>
    </div>
  </section>

  <section class="strip" aria-hidden="true">
    <div class="band band--a"><div class="band__row" id="rowA"></div></div>
    <div class="band band--b"><div class="band__row" id="rowB"></div></div>
  </section>

  <section class="pin" id="manifesto">
    <div class="pin__in"><p class="mani" id="mani"></p></div>
  </section>

  <section class="sec" id="stats">
    <p class="mono kick rv">By the numbers</p>
    <div class="stats" id="statsGrid"></div>
  </section>

  <section class="sec" id="work">
    <div class="sh rv">
      <h2 class="h2">Everything<br>I've made</h2>
      <p class="mono" id="workHint"></p>
    </div>
    <ul class="list rv" id="list"></ul>
  </section>

  <div id="chapters"></div>

  <section class="hz" id="gallery" aria-label="What I build">
    <div class="hz__in"><div class="hz__track" id="hzTrack"></div></div>
  </section>

  <section class="sec" id="timeline">
    <div class="sh rv"><h2 class="h2">How I<br>got here</h2><p class="mono">One project at a time</p></div>
    <ol class="tl" id="tl"><span class="tl__line"></span><span class="tl__fill" id="tlFill"></span></ol>
  </section>

  <section class="sec" id="about">
    <p class="mono kick rv">About</p>
    <p class="big" id="aboutBig"></p>
    <div class="cols rv">
      <div><h3 class="mono">Toolbox</h3><ul class="tools" id="tools"></ul></div>
      <div><h3 class="mono">Right now</h3><ul class="xp" id="now"></ul></div>
      <div><h3 class="mono">Elsewhere</h3><ul class="links" id="links"></ul></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <h2 class="mega rv" id="mega"></h2>
    <button class="email rv" id="copyBtn" type="button" data-magnet data-cursor="link" aria-label="Copy email address">
      <span class="email__t" id="emailT"></span><span class="email__s" id="copyS" aria-hidden="true">Copy</span>
    </button>
    <ul class="socials rv" id="socials"></ul>
  </section>

  <footer class="mono"><span id="foot"></span><a href="#home">Back to top ↑</a></footer>
</main>

<div class="peek" id="peek" aria-hidden="true"></div>
<div class="cur" id="cur" aria-hidden="true"><span></span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="grain" aria-hidden="true"></div>

<noscript><p style="position:fixed;inset:auto 16px 16px;padding:12px 16px;background:#fff;color:#000;font:14px sans-serif;border-radius:8px">This site is interactive and needs JavaScript turned on.</p></noscript>

<script src="js/themes.js"></script>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/stage.js"></script>
<script src="js/main.js"></script>
</body>
</html>
